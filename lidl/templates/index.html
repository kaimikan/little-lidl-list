<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lidl List</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-light">
    <header>
        <div class="header-content">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" width="40" height="40">
                    <rect width="40" height="40" rx="8" fill="#0050AA"/>
                    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
                          fill="#FFF200" font-size="20" font-weight="900">L</text>
                </svg>
                <div>
                    <h1>Little Lidl List</h1>
                    <p class="subtitle">Healthy picks for training &mdash; Lidl Bulgaria</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-theme" onclick="toggleTheme()" title="Toggle theme">
                    <span class="theme-icon-light">&#9789;</span>
                    <span class="theme-icon-dark">&#9788;</span>
                </button>
                <button id="scan-btn" class="btn-scan" onclick="startScan()">
                    <span class="btn-icon">&#x27F3;</span> Scan Now
                </button>
            </div>
        </div>
    </header>

    <div id="scan-banner" class="scan-banner hidden">
        <div class="scan-spinner"></div>
        <span id="scan-message">Scanning Lidl Bulgaria...</span>
    </div>

    <main>
        <div class="controls">
            <div class="control-group">
                <label>Min Score</label>
                <div class="score-slider">
                    <input type="range" id="min-score" min="1" max="15" value="1" oninput="onFilterChange()">
                    <span id="min-score-val" class="slider-val">1</span>
                </div>
            </div>

            <div class="control-group">
                <label>Category</label>
                <select id="category-filter" onchange="onFilterChange()">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tags</label>
                <div id="tag-filters" class="tag-filters">
                    <button class="tag-btn active" data-tag="" onclick="toggleTag(this)">All</button>
                    <button class="tag-btn" data-tag="protein" onclick="toggleTag(this)">Protein</button>
                    <button class="tag-btn" data-tag="carbs" onclick="toggleTag(this)">Carbs</button>
                    <button class="tag-btn" data-tag="healthy_fat" onclick="toggleTag(this)">Healthy Fat</button>
                    <button class="tag-btn" data-tag="vegetable" onclick="toggleTag(this)">Vegetable</button>
                    <button class="tag-btn" data-tag="fruit" onclick="toggleTag(this)">Fruit</button>
                    <button class="tag-btn" data-tag="supplement" onclick="toggleTag(this)">Supplement</button>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <span id="stats-text">Loading...</span>
            <button id="sale-toggle" class="sale-pill" onclick="toggleSale()">
                <span class="sale-pill-dot"></span> On Sale Only
            </button>
        </div>

        <div id="products-grid" class="products-grid"></div>

        <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">&#128203;</div>
            <h2>No products found</h2>
            <p>Try lowering the minimum score or click <strong>Scan Now</strong> to fetch fresh data.</p>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
